spring:
  jackson:
    mapper:
      accept-case-insensitive-enums: true
    time-zone: America/Sao_Paulo
  jpa:
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    baseline-on-migrate: true

server:
  error:
    include-stacktrace: never

api:
  security:
    token:
      secret: ${JWT_SECRET:123456}
      expiration: ${JWT_EXPIRATION:15}

bank:
  name: ${BANK_NAME:Quantum Banking S.A.}
  compe: ${BANK_CODE:999}
  ispb: ${BANK_ISPB:00000010}
  cnpj: ${BANK_CNPJ:00000000000191}
  accountNumber: ${BANK_ACCOUNT_NUMBER:000000001}
  agencyNumber: ${BANK_AGENCY_NUMBER:0001}

admin:
  cpf: ${ADMIN_CPF:00000000000}
  password: ${ADMIN_PASSWORD:root123}
  name: ${ADMIN_NAME:Admin}
  phone: ${ADMIN_PHONE:4004-0042}
  email: ${ADMIN_EMAIL:admin@quantumbank.com.br}

transaction:
  withdrawal-reprocessor:
    fixed-rate-ms: ${WITHDRAWAL_REPROCESSOR_RATE_MS:60000}
  duplicate-window: ${DUPLICATE_WINDOW_SECONDS:30s}
  timezone: ${TRANSACTION_TIMEZONE:America/Sao_Paulo}
  nighttime-limit: ${NIGHTTIME_LIMIT:1000.00}
  max-atm-amount: ${MAX_ATM_AMOUNT:5000.00}
  hold-duration: ${WITHDRAWAL_HOLD_DURATION:1d}

  reprocessor:
    fixed-rate-ms: ${TRANSACTION_REPROCESSOR_RATE_MS:60000}
    minimum-pending-time: ${TRANSACTION_REPROCESSOR_MIN_PENDING:5m}
    batch-size: ${TRANSACTION_REPROCESSOR_BATCH_SIZE:100}
  watchdog:
    check-rate-ms: ${TRANSACTION_WATCHDOG_RATE_MS:30000}
  outbox:
    publisher:
      fixed-rate-ms: ${TRANSACTION_OUTBOX_RATE_MS:5000}
      max-retry-attempts: ${TRANSACTION_OUTBOX_MAX_RETRIES:5}

loan:
  interest-rate: 2.5

cache:
  reprocessor:
    fixed-rate-ms: ${CACHE_REPROCESSOR_RATE_MS:60000}
    minimum-pending-time: ${CACHE_REPROCESSOR_MIN_PENDING:5m}
    batch-size: ${CACHE_REPROCESSOR_BATCH_SIZE:100}
  watchdog:
    check-rate-ms: ${CACHE_WATCHDOG_RATE_MS:30000}

simulation:
  external-liquidation:
    success-rate: ${LIQUIDATION_SUCCESS_RATE:0.9}
    min-delay-ms: ${LIQUIDATION_MIN_DELAY_MS:200}
    max-delay-ms: ${LIQUIDATION_MAX_DELAY_MS:1500}